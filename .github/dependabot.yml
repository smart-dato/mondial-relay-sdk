# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 1

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 1
    ignore:
      # laravel/framework still requires guzzle ^7.8.2, so a major bump here can
      # never resolve. Remove this once Laravel ships support for guzzle 8.
      - dependency-name: "guzzlehttp/guzzle"
        update-types: ["version-update:semver-major"]
